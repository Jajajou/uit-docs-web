name: backend-ci

# Backend quality-gate workflow for the admin dashboard FastAPI service.
# Implements design section C3 and Requirements 1.1, 1.3, 3.1, 3.2, 3.3,
# 3.4, 3.5, 3.7, 5.4, 19.3.
#
# Sequence (each step gates the next via implicit success-only execution):
#   1. Setup Python 3.11 + pip cache (keyed on requirements*.txt)
#   2. Lockfile-pin guard         (scripts/ci/check_requirements_pinned.sh, task 3.4)
#   3. Install runtime + dev deps (requirements.txt, requirements-dev.txt)
#   4. ruff check .
#   5. Detect mypy configuration  (mypy.ini OR [tool.mypy] in pyproject.toml)
#   6. mypy app                   (only when has_mypy == 'true')
#   7. pytest --cov=app --cov-report=xml
#   8. Coverage gate              (scripts/ci/coverage_gate.py, task 3.5)
#   9. Alembic round-trip check   (scripts/ci/alembic_round_trip.sh, task 3.7)
#  10. Upload coverage.xml artifact (if: always(), retention 14d)

on:
  pull_request:
    branches: [main]
    paths:
      - 'web/apps/admin-dashboard/backend/**'
      - '.github/workflows/backend-ci.yml'
  push:
    branches: [main]
    paths:
      - 'web/apps/admin-dashboard/backend/**'
      - '.github/workflows/backend-ci.yml'

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: web/apps/admin-dashboard/backend

jobs:
  backend-ci:
    name: backend-ci
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            web/apps/admin-dashboard/backend/requirements.txt
            web/apps/admin-dashboard/backend/requirements-dev.txt

      - name: Lockfile-pin guard
        # Wired to scripts/ci/check_requirements_pinned.sh (sub-task 3.4).
        # Run before pip install per Requirement 19.5.
        run: ../../../../scripts/ci/check_requirements_pinned.sh requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Detect mypy configuration
        id: mypy_detect
        # Emits has_mypy=true when mypy.ini exists OR pyproject.toml declares
        # a [tool.mypy] section. Drives the conditional mypy step below.
        run: |
          has_mypy=false
          if [[ -f mypy.ini ]]; then
            has_mypy=true
          elif [[ -f pyproject.toml ]] && grep -Eq '^\[tool\.mypy\]' pyproject.toml; then
            has_mypy=true
          fi
          echo "has_mypy=${has_mypy}" >> "$GITHUB_OUTPUT"

      - name: Mypy
        if: steps.mypy_detect.outputs.has_mypy == 'true'
        run: mypy app

      - name: Pytest with coverage
        run: pytest --cov=app --cov-report=xml

      - name: Coverage gate (>= 70%)
        # Wired to scripts/ci/coverage_gate.py (sub-task 3.5).
        # Runs immediately after pytest per Requirement 3.6.
        run: python ../../../../scripts/ci/coverage_gate.py coverage.xml

      - name: Alembic migration round-trip
        # Wired to scripts/ci/alembic_round_trip.sh (sub-task 3.7).
        # Runs after the coverage gate per Requirements 12.1-12.4.
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: ../../../../scripts/ci/alembic_round_trip.sh

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-backend-coverage-${{ github.sha }}
          path: web/apps/admin-dashboard/backend/coverage.xml
          if-no-files-found: ignore
          retention-days: 14
