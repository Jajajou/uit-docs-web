name: docker-build-publish

# Docker build and publish workflow for the admin dashboard, the LangGraph
# admin backend, and the LightRAG sidecar. Implements task 6.1 of the
# cicd-deploy-admin-dashboard spec and design section C6.
#
# Trigger envelope (Requirements 7.1, 7.2):
#   - push to main         -> tags {main, sha-<sha>}
#   - push to tag v*       -> tags {<ref_name>, latest}
#
# Each matrix slot is independent: a failure in one image does not skip
# the others (Requirement 7.7, fail-fast disabled below). The job-level
# timeout-minutes: 30 enforces the per-image budget (Requirement 7.1, 7.2).
#
# Extension points for sibling sub-tasks (6.2 cosign, 6.3 Trivy, 6.4
# build-twice) are clearly marked and use named step
# `id:`s so downstream tasks can reference outputs without re-shaping
# the workflow. The tag-set computation (sub-task 6.6) is implemented
# via `scripts/ci/compute_tags.sh`, invoked by the `compute_tags` step.

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

concurrency:
  group: docker-build-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  # `id-token: write` is required for cosign keyless OIDC signing
  # (sub-task 6.2, Requirements 7.6/7.7). The GitHub Actions OIDC token
  # is exchanged for a short-lived Fulcio certificate that signs the
  # pushed image digest; the signature is recorded in Rekor and pushed
  # to GHCR alongside the image.
  id-token: write

jobs:
  build-and-publish:
    name: build-and-publish (${{ matrix.image.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Per-slot independence: do not cancel sibling slots if one fails
      # (Requirement 7.7).
      fail-fast: false
      matrix:
        image:
          - { name: admin_backend,  context: web/apps/admin-dashboard/backend }
          - { name: admin_frontend, context: web/apps/admin-dashboard/frontend }
          - { name: lightrag,       context: LightRAG }
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4
        with:
          # Full history is required so `git show -s --format=%ct <sha>`
          # can resolve the commit timestamp for SOURCE_DATE_EPOCH below
          # (Requirement 19.4).
          fetch-depth: 0

      - name: Compute build metadata
        id: build_meta
        # Computes BUILD_TIME (ISO 8601 UTC, second precision) once per
        # workflow run, the SOURCE_DATE_EPOCH for the commit, and the
        # GHCR image reference. Exposed via step outputs so subsequent
        # steps and follow-up tasks (6.2/6.3/6.4) can consume them.
        shell: bash
        env:
          EV_SHA: ${{ github.sha }}
          OWNER: ${{ github.repository_owner }}
          IMAGE_NAME: ${{ matrix.image.name }}
        run: |
          set -euo pipefail
          BUILD_TIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$EV_SHA")"
          OWNER_LC="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          IMAGE_REF="ghcr.io/${OWNER_LC}/${IMAGE_NAME}"
          {
            echo "build_time=${BUILD_TIME}"
            echo "source_date_epoch=${SOURCE_DATE_EPOCH}"
            echo "owner_lc=${OWNER_LC}"
            echo "image_ref=${IMAGE_REF}"
          } >> "$GITHUB_OUTPUT"

      - name: Compute tags
        id: compute_tags
        # Delegates the tag set per design Property 12 to the dedicated
        # `scripts/ci/compute_tags.sh` helper (task 6.6). The script
        # prints one tag suffix per line on stdout for the event:
        #   push:main           -> {main, sha-<sha>}
        #   push:tag (v*)       -> {<ref_name>, latest}
        #   push:tag (non-v*)   -> empty
        # The caller here prepends the per-slot GHCR image reference and
        # exposes the resulting newline-separated tag list as the
        # `tags` output, which is consumed verbatim by the `tags:` input
        # of `docker/build-push-action@v5`.
        shell: bash
        env:
          EV_NAME: ${{ github.event_name }}
          EV_REF: ${{ github.ref }}
          EV_REF_NAME: ${{ github.ref_name }}
          EV_SHA: ${{ github.sha }}
          IMAGE_REF: ${{ steps.build_meta.outputs.image_ref }}
        run: |
          set -euo pipefail
          if [[ "$EV_NAME" == "push" && "$EV_REF" == "refs/heads/main" ]]; then
            suffixes="$(scripts/ci/compute_tags.sh push:main "$EV_SHA")"
          elif [[ "$EV_NAME" == "push" && "$EV_REF" =~ ^refs/tags/ ]]; then
            suffixes="$(scripts/ci/compute_tags.sh push:tag "$EV_REF_NAME")"
          else
            echo "::error::Unsupported event for docker-build-publish: ${EV_NAME} ${EV_REF}"
            exit 1
          fi
          {
            echo 'tags<<__EOF__'
            while IFS= read -r suffix; do
              [[ -z "$suffix" ]] && continue
              printf '%s:%s\n' "$IMAGE_REF" "$suffix"
            done <<< "$suffixes"
            echo '__EOF__'
          } >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------
      # GHCR login (Requirement 7.3, 7.8): up to 3 attempts (1 initial +
      # 2 retries) using docker/login-action@v3. The first two attempts
      # use continue-on-error so a transient auth failure can be retried
      # without failing the slot; the third attempt has no continue-on-
      # error and fails the slot if it does not succeed.
      # ------------------------------------------------------------------
      - name: GHCR login (attempt 1)
        id: ghcr_login_1
        uses: docker/login-action@v3
        continue-on-error: true
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: GHCR login (retry 1)
        id: ghcr_login_2
        if: steps.ghcr_login_1.outcome == 'failure'
        uses: docker/login-action@v3
        continue-on-error: true
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: GHCR login (retry 2)
        id: ghcr_login_3
        if: steps.ghcr_login_2.outcome == 'failure'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        id: buildx_setup
        uses: docker/setup-buildx-action@v3

      - name: Install cosign
        id: cosign_install
        # Pinned major version of the official cosign installer. cosign
        # itself is invoked in the `cosign_sign` step below using
        # keyless OIDC signing (sub-task 6.2, Requirements 7.6/7.7).
        uses: sigstore/cosign-installer@v3

      - name: Build and push image
        id: build_push
        # On any non-zero exit from this step the slot fails, GitHub
        # Actions halts subsequent steps in this slot, and the workflow
        # run conclusion is `failure` for this matrix entry. Sibling
        # slots are unaffected because fail-fast is disabled (R7.7).
        # No partially built artifact is published because docker/build-
        # push-action only pushes after a successful build.
        uses: docker/build-push-action@v5
        env:
          # SOURCE_DATE_EPOCH is consumed by BuildKit to stamp file
          # mtimes deterministically (Requirement 19.4).
          SOURCE_DATE_EPOCH: ${{ steps.build_meta.outputs.source_date_epoch }}
        with:
          context: ${{ matrix.image.context }}
          push: true
          provenance: true
          sbom: true
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.build_meta.outputs.build_time }}
          tags: ${{ steps.compute_tags.outputs.tags }}
          # Per Requirement 13.5, build-time secrets MUST flow through
          # BuildKit `--secret` mounts only, never via build-args or
          # env files. No secrets are required by the current Dockerfiles;
          # when one is, add it here, e.g.:
          #   secrets: |
          #     pip_index_url=${{ secrets.PIP_INDEX_URL }}
          # and consume it in the Dockerfile with
          #   RUN --mount=type=secret,id=pip_index_url ...

      - name: Sign image with cosign
        id: cosign_sign
        # Keyless OIDC signing (Requirements 7.6, 7.7). The cosign CLI
        # exchanges the GitHub Actions OIDC token for a short-lived
        # Fulcio certificate, signs the pushed image by digest, records
        # the signature in Rekor, and pushes the signature artifact to
        # GHCR next to the image. Signing only by digest (never by tag)
        # ensures the signature is bound to the exact bytes that were
        # pushed by `build_push`, regardless of how many tags point at
        # that digest.
        #
        # Alternative key-based signing via `COSIGN_PRIVATE_KEY` is
        # documented in `docs/runbooks/admin-dashboard.md` under
        # `## Production Configuration`; the workflow stays on keyless
        # by default so no long-lived signing key has to be rotated.
        shell: bash
        env:
          # `cosign sign` consumes COSIGN_EXPERIMENTAL=1 on older cosign
          # builds to enable keyless OIDC; setting it explicitly keeps
          # the step compatible with both v1 and v2 of the cosign CLI
          # without changing the default flow on current versions.
          COSIGN_EXPERIMENTAL: "1"
          IMAGE_REF: ${{ steps.build_meta.outputs.image_ref }}
          IMAGE_DIGEST: ${{ steps.build_push.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ -z "${IMAGE_DIGEST:-}" ]]; then
            echo "::error::build_push did not produce a digest; cannot sign"
            exit 1
          fi
          cosign sign --yes "${IMAGE_REF}@${IMAGE_DIGEST}"

      - name: Scan image for secrets (Trivy)
        id: trivy_secret_scan
        # Sub-task 6.3 / Requirements 13.6, 13.7, 13.8.
        #
        # Runs Trivy in `image --scanners secret` mode against the freshly
        # pushed image, addressed by digest so the scan is bound to the
        # exact bytes published by `build_push`. `--exit-code 1` makes
        # Trivy return non-zero when any secret finding is reported, and
        # `timeout 600` enforces the 10-minute fail-closed budget from
        # R13.7: on timeout, the `timeout` utility exits 124, the shell's
        # `set -e` propagates that as a non-zero step exit, and the slot
        # is marked failed. `set -e` similarly propagates a Trivy crash
        # (e.g. registry pull failure) so the slot fails closed instead
        # of silently advancing.
        #
        # The step gates on `github.event_name == 'push'` per R13.8 and
        # the task spec; the workflow only triggers on push:main and
        # push:tags v* today (see the `on:` block above), so the guard is
        # defensive against future trigger additions and documents intent.
        #
        # The host's docker credentials (populated by the earlier
        # `docker/login-action` step) are mounted read-only into the
        # Trivy container so it can pull the image manifest from GHCR
        # without needing a separate registry login. The mount is
        # read-only so a malicious image cannot rewrite the runner's
        # credentials. `~/.docker/config.json` is created by docker/login-
        # action; if it is absent (login skipped), the mount source is a
        # bind to a non-existent path which `docker run` will reject —
        # that surfaces as a non-zero exit and fails the slot as desired.
        #
        # `fail-fast: false` on the matrix above ensures a secret-scan
        # failure in one image does not cancel sibling slots; only the
        # offending slot is marked failed and no further steps run for
        # it (R7.7).
        if: ${{ github.event_name == 'push' }}
        shell: bash
        env:
          IMAGE_REF: ${{ steps.build_meta.outputs.image_ref }}
          IMAGE_DIGEST: ${{ steps.build_push.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ -z "${IMAGE_DIGEST:-}" ]]; then
            echo "::error::build_push did not produce a digest; cannot run secret scan"
            exit 1
          fi
          timeout 600 docker run --rm \
            -v "$HOME/.docker/config.json:/root/.docker/config.json:ro" \
            aquasec/trivy:latest \
            image \
            --scanners secret \
            --exit-code 1 \
            "${IMAGE_REF}@${IMAGE_DIGEST}"

  # --------------------------------------------------------------------
  # Sub-task 6.4: reproducibility verification (R7.5, R19.1, R19.4, CP-6).
  #
  # The `build-twice` job below re-builds the same matrix from the same
  # commit on the same builder image (ubuntu-latest, buildx v3) with
  # identical build-args and the same SOURCE_DATE_EPOCH, then asserts
  # that the layer digests of the rebuilt image match those of the
  # image already pushed by `build-and-publish`.
  #
  # ## Approach
  #
  # The task design (`design.md` §C6 step 6) prescribes comparing
  # `docker buildx imagetools inspect` outputs between two pushed runs.
  # That requires pushing to GHCR twice, which would (a) double the
  # publish surface area, (b) race against cosign signing of the second
  # push, and (c) leak partially verified artifacts into GHCR if the
  # comparison failed.
  #
  # Instead we use the explicit simplification documented in task 6.4:
  # the second build runs locally with `push: false` + `load: true`,
  # and we compare `docker image inspect --format '{{json .RootFS.Layers}}'`
  # against the digests of the already-pushed image, which we re-pull
  # from GHCR by manifest digest (resolved via `docker buildx imagetools
  # inspect`). This compares the exact bytes that were published, is
  # immune to tag races, and never publishes a second artifact.
  #
  # `RootFS.Layers` is the ordered list of layer diffIDs (uncompressed
  # layer SHA-256s). A layer-by-layer equality assertion is strictly
  # stronger than the design's "application-source layer and the
  # dependency-install layer" requirement: if any layer (base, deps,
  # source) differs, the assertion fails. Per design assumption (5)
  # base/tooling layers inherit reproducibility from the pinned builder
  # image; in practice they are always equal here because both runs
  # pull the same pinned base from `Dockerfile`.
  #
  # ## BUILD_TIME determinism
  #
  # None of the Dockerfiles for `admin_backend`, `admin_frontend`, or
  # `lightrag` reference `BUILD_TIME` or `GIT_SHA` in any `RUN`, `COPY`,
  # `LABEL`, or `ENV` instruction that would embed them in a layer.
  # Both args therefore do not affect layer digests, and recomputing
  # `BUILD_TIME` here (rather than threading it through a job output
  # from `build-and-publish`) is safe. The args are still passed
  # identically in shape to keep build-args parity per task 6.4.
  #
  # ## Trigger gating
  #
  # The workflow's top-level `on:` only fires for `push: main` and
  # `push: tags v*`, so `if: success()` plus `needs: build-and-publish`
  # is sufficient to satisfy "runs only on push:main and tag pushes".
  # An explicit event-name guard inside the job catches any future
  # trigger added to `on:` that should not run reproducibility checks.
  # --------------------------------------------------------------------

  build-twice:
    name: build-twice (${{ matrix.image.name }})
    needs: build-and-publish
    if: ${{ success() && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # `packages: read` is sufficient: build-twice never pushes.
      packages: read
    strategy:
      # Per-slot independence mirrors `build-and-publish`: a mismatch in
      # one image must not hide mismatches in the other two.
      fail-fast: false
      matrix:
        image:
          - { name: admin_backend,  context: web/apps/admin-dashboard/backend }
          - { name: admin_frontend, context: web/apps/admin-dashboard/frontend }
          - { name: lightrag,       context: LightRAG }
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4
        with:
          # Same `fetch-depth: 0` as `build-and-publish` so
          # `git show -s --format=%ct <sha>` resolves the commit
          # timestamp for SOURCE_DATE_EPOCH (R19.4).
          fetch-depth: 0

      - name: Compute build metadata
        id: build_meta
        # Mirrors the `build_meta` step in `build-and-publish`. See
        # the file-level note above on why recomputing BUILD_TIME here
        # is safe for this matrix.
        shell: bash
        env:
          EV_SHA: ${{ github.sha }}
          OWNER: ${{ github.repository_owner }}
          IMAGE_NAME: ${{ matrix.image.name }}
        run: |
          set -euo pipefail
          BUILD_TIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$EV_SHA")"
          OWNER_LC="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          IMAGE_REF="ghcr.io/${OWNER_LC}/${IMAGE_NAME}"
          {
            echo "build_time=${BUILD_TIME}"
            echo "source_date_epoch=${SOURCE_DATE_EPOCH}"
            echo "owner_lc=${OWNER_LC}"
            echo "image_ref=${IMAGE_REF}"
          } >> "$GITHUB_OUTPUT"

      - name: Compute pull tag
        id: pull_tag
        # Picks the most specific tag that `build-and-publish` pushed
        # for this event:
        #   push:main   -> sha-<sha>      (immutable, points at this commit)
        #   push:tag v* -> <ref_name>     (the just-pushed tag itself)
        # We then resolve the manifest digest from this tag, so even
        # if a later run advanced `main` or `latest` we still inspect
        # the bytes that this exact run produced.
        shell: bash
        env:
          EV_NAME: ${{ github.event_name }}
          EV_REF: ${{ github.ref }}
          EV_REF_NAME: ${{ github.ref_name }}
          EV_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EV_NAME" == "push" && "$EV_REF" == "refs/heads/main" ]]; then
            PULL_TAG="sha-${EV_SHA}"
          elif [[ "$EV_NAME" == "push" && "$EV_REF" =~ ^refs/tags/ ]]; then
            PULL_TAG="${EV_REF_NAME}"
          else
            echo "::error::build-twice should only run on push:main or push:tags v* (event=${EV_NAME} ref=${EV_REF})"
            exit 1
          fi
          echo "pull_tag=${PULL_TAG}" >> "$GITHUB_OUTPUT"

      - name: GHCR login
        id: ghcr_login
        # `packages: read` is enough; we never push from this job.
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve original manifest digest and pull image
        id: original
        # Resolves the immutable manifest digest of the just-pushed
        # image via `docker buildx imagetools inspect` (which talks to
        # the registry without needing to pull layers first), then
        # pulls the image *by digest*. Pulling by digest is what makes
        # this assertion robust against any tag races (R7.5/R19.1 want
        # parity with the bytes that were actually published, not
        # whatever the tag may point to in the future).
        shell: bash
        env:
          IMAGE_REF: ${{ steps.build_meta.outputs.image_ref }}
          PULL_TAG: ${{ steps.pull_tag.outputs.pull_tag }}
        run: |
          set -euo pipefail
          ORIGINAL_DIGEST="$(docker buildx imagetools inspect "${IMAGE_REF}:${PULL_TAG}" --format '{{json .Manifest}}' | jq -r '.digest // empty')"
          if [[ -z "${ORIGINAL_DIGEST}" ]]; then
            echo "::error::Could not resolve manifest digest for ${IMAGE_REF}:${PULL_TAG}"
            exit 1
          fi
          echo "Resolved ${IMAGE_REF}:${PULL_TAG} -> ${ORIGINAL_DIGEST}"
          docker pull "${IMAGE_REF}@${ORIGINAL_DIGEST}"
          ORIGINAL_LAYERS_JSON="$(docker image inspect "${IMAGE_REF}@${ORIGINAL_DIGEST}" --format '{{json .RootFS.Layers}}')"
          printf '%s\n' "${ORIGINAL_LAYERS_JSON}" > original-layers.json
          echo "Original RootFS.Layers:"
          jq . original-layers.json
          {
            echo "digest=${ORIGINAL_DIGEST}"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        id: buildx_setup
        uses: docker/setup-buildx-action@v3

      - name: Rebuild image locally (no push)
        id: rebuild
        # Identical build-args, identical SOURCE_DATE_EPOCH, identical
        # context. `push: false` + `load: true` keeps the rebuilt image
        # in the local Docker daemon so the next step can inspect its
        # `RootFS.Layers`. We deliberately omit `provenance` and `sbom`
        # here because (a) they produce separate manifests that cannot
        # be loaded into the local daemon, and (b) they do not affect
        # the image layer digests we are comparing.
        uses: docker/build-push-action@v5
        env:
          SOURCE_DATE_EPOCH: ${{ steps.build_meta.outputs.source_date_epoch }}
        with:
          context: ${{ matrix.image.context }}
          push: false
          load: true
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.build_meta.outputs.build_time }}
          tags: ${{ matrix.image.name }}:rebuild-${{ github.sha }}

      - name: Capture rebuild layer digests
        id: rebuild_layers
        shell: bash
        env:
          REBUILD_REF: ${{ matrix.image.name }}:rebuild-${{ github.sha }}
        run: |
          set -euo pipefail
          REBUILD_LAYERS_JSON="$(docker image inspect "${REBUILD_REF}" --format '{{json .RootFS.Layers}}')"
          printf '%s\n' "${REBUILD_LAYERS_JSON}" > rebuild-layers.json
          echo "Rebuild RootFS.Layers:"
          jq . rebuild-layers.json

      - name: Assert layer-digest equality
        # The assertion fails the workflow run on any layer mismatch
        # (R7.5, R19.1). Comparing the full `RootFS.Layers` list is
        # strictly stronger than the design's "application-source +
        # dependency-install layers" wording: those layers are a
        # subset of `RootFS.Layers`, so equality of the whole list
        # implies equality of the required subset. Other layers (base
        # OS, build tooling) are expected to match because both builds
        # pull the same pinned base image; if they ever diverge that
        # is itself a reproducibility regression worth surfacing.
        shell: bash
        env:
          IMAGE_NAME: ${{ matrix.image.name }}
          ORIGINAL_DIGEST: ${{ steps.original.outputs.digest }}
        run: |
          set -euo pipefail
          if diff -u original-layers.json rebuild-layers.json > layer-diff.txt; then
            echo "::notice title=build-twice::${IMAGE_NAME} reproducibility OK (digest=${ORIGINAL_DIGEST})"
            echo "All RootFS layer digests match between the published image and the local rebuild."
          else
            echo "::error title=build-twice::${IMAGE_NAME} layer-digest mismatch (original=${ORIGINAL_DIGEST})"
            echo "Diff between published RootFS.Layers and rebuilt RootFS.Layers:"
            cat layer-diff.txt
            exit 1
          fi

      - name: Upload layer-digest evidence
        # Always upload both layer files and the diff so a failed run
        # has the artifacts an operator needs to investigate without
        # having to re-run the job.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-twice-layers-${{ matrix.image.name }}-${{ github.sha }}
          path: |
            original-layers.json
            rebuild-layers.json
            layer-diff.txt
          if-no-files-found: ignore
          retention-days: 14
