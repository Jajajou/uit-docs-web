# Admin Dashboard Docker Compose
# Run standalone: docker compose up -d
# Or integrate with main docker-compose.yml

services:
  admin_backend:
    container_name: admin_backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: ./backend/.env
    ports:
      - "8001:8001"
    volumes:
      - ./backend/uploads:/app/uploads
    environment:
      - LIGHTRAG_URL=http://lightrag_uit:9621
    networks:
      - uit_network
    restart: unless-stopped

  admin_frontend:
    container_name: admin_frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - admin_backend
    networks:
      - uit_network
    restart: unless-stopped

networks:
  uit_network:
    external: true
