[project]
name = "admin-dashboard-api"
version = "0.1.0"
description = "Admin Dashboard API for UIT_DOCS_AGENT - FastAPI middleware for document upload and management"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "python-dotenv>=1.0.1",
    "requests>=2.31.0",
    "pydantic>=2.9.0",
    "aiofiles>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api"]

[tool.ruff]
line-length = 160
lint.select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
norecursedirs = [".pytest_cache", "pytest-cache-files-*"]
