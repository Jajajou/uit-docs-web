# Alembic configuration for admin-dashboard workspace store.
# Run from: web/apps/admin-dashboard/backend/

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

# Connection string is overridden at runtime by alembic/env.py
# to read from WORKSPACE_DATABASE_URL environment variable.
sqlalchemy.url = driver://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
